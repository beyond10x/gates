name: Shared source gates

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read
  checks: read

jobs:
  common:
    uses: beyond10x/gates/.github/workflows/common.yml@c949e63ddfba31b400ce2a2455c995807ab2f6fa
    secrets:
      B10X_GATES_POLICY_GZ: ${{ secrets.B10X_GATES_POLICY_GZ }}
      B10X_GATES_POLICY: ${{ secrets.B10X_GATES_POLICY }}
