name: Common source gates

on:
  workflow_call:
    secrets:
      # The policy, gzip -9 then base64 (`gzip -9 -c policy.json | base64 -w0`), under the
      # 48 KB secret limit. Read first when set and non-empty.
      B10X_GATES_POLICY_GZ:
        required: false
      # The plain JSON policy, for callers that have not moved to the compressed secret.
      B10X_GATES_POLICY:
        required: false

permissions:
  contents: read
  checks: read

jobs:
  check:
    name: Security and privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # This workflow never checks out candidate source or executes a candidate action.
      - name: Fetch verified Gates release
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/beyond10x/gates/releases/download/0.1.24/b10x-gates-linux-x86_64 \
            --output "$RUNNER_TEMP/b10x-gates"
          printf '%s  %s\n' '5e10b7aaf1326e6e98223ef2da5b43a27b33c4b2f8962792be5bf6496bd08b2e' "$RUNNER_TEMP/b10x-gates" | sha256sum --check --status
          chmod 700 "$RUNNER_TEMP/b10x-gates"
      - name: Fetch pinned published Gitleaks
        run: '"$RUNNER_TEMP/b10x-gates" bootstrap --directory "$RUNNER_TEMP/gitleaks"'
      - name: Verify evidence or scan Git objects as data
        env:
          B10X_GATES_POLICY_GZ: ${{ secrets.B10X_GATES_POLICY_GZ }}
          B10X_GATES_POLICY_JSON: ${{ secrets.B10X_GATES_POLICY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/b10x-gates" --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks" ci --event "$GITHUB_EVENT_PATH" --objects "$RUNNER_TEMP/candidate.git"'
