name: Common source gates

on:
  workflow_call:
    secrets:
      B10X_GATES_POLICY:
        required: true

permissions:
  contents: read
  checks: read

jobs:
  check:
    name: Security and privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # This workflow never checks out candidate source or executes a candidate action.
      - name: Fetch verified Gates release
        shell: bash
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/beyond10x/gates/releases/download/0.1.3/b10x-gates-linux-x86_64 \
            --output "$RUNNER_TEMP/b10x-gates"
          printf '%s  %s\n' '6a0722fc5b26d1b55f6c6fc771bf0e261a1068b52eba96785d54d4b2122e98cf' "$RUNNER_TEMP/b10x-gates" | sha256sum --check --status
          chmod 700 "$RUNNER_TEMP/b10x-gates"
      - name: Fetch pinned published Gitleaks
        run: '"$RUNNER_TEMP/b10x-gates" bootstrap --directory "$RUNNER_TEMP/gitleaks"'
      - name: Verify evidence or scan Git objects as data
        env:
          B10X_GATES_POLICY_JSON: ${{ secrets.B10X_GATES_POLICY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/b10x-gates" --gitleaks "$RUNNER_TEMP/gitleaks/gitleaks" ci --event "$GITHUB_EVENT_PATH" --objects "$RUNNER_TEMP/candidate.git"'
