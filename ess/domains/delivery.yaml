domain: gates.delivery
summary: >-
  The Git verbs `b10x-gates bot` runs as the bot. `merge` and `revert` run in their
  no-commit form in the bot environment, then the bot commits the result, so the one
  commit they create is authored and committed by the bot and passes `pre-commit` and
  `commit-msg`. The host observes the facts each outcome reads before it runs Git:
  the options it refuses, the revisions named, the merge drivers the repository's own
  configuration declares (read as data) and any operation already in progress; Git's
  result is observed after the no-commit run. `delete-branch` is the one verb that
  is not Git: it deletes a merged remote branch through the REST API as the App,
  after reading the branch, its protection, the rulesets that apply to it and its
  ancestry with the default branch.

entities:
  # A branch on the GitHub remote, as the App reads it: its tip, whether classic
  # branch protection is enabled on it and whether it is the repository's default
  # branch. `delete-branch` is the only way the bot removes one, and only once its
  # tip is an ancestor of the default branch, so no commit becomes unreachable.
  - name: gates.delivery.RemoteBranch
    identity: {name: name, type: String}
    fields:
      - {name: tip, type: String}
      # Classic branch protection enabled: the branch answer's `protection.enabled`,
      # a JSON boolean; an answer without one is refused. Not the answer's top-level
      # `protected`, which GitHub sets for a branch under any ruleset, the
      # bot-authority ruleset included; rulesets are judged by `ruled-branch` and
      # `deletion-restricted`.
      - {name: protected, type: Boolean}
      - {name: default, type: Boolean}
    lifecycle:
      initial: Present
      states: [Present, Deleted]
      terminal: [Deleted]
      transitions:
        - {name: delete, from: [Present], to: Deleted}

types:
  - name: gates.delivery.Operation
    kind: enum
    variants: [None, Merge, Revert, CherryPick, Rebase]
  - name: gates.delivery.Integration
    kind: enum
    variants: [Clean, Conflicted, UpToDate]
  - name: gates.delivery.Reversion
    kind: enum
    variants: [Clean, Conflicted]
  # GitHub's `compare/<tip>...<default>` status: `Ahead` and `Identical` mean the
  # tip is an ancestor of the default branch.
  - name: gates.delivery.Ancestry
    kind: enum
    variants: [Ahead, Identical, Behind, Diverged]
  # Where `install` took a value from: its flag (or the flag's environment variable),
  # the installed hooks' configuration, the default path under the configuration home
  # (`b10x/gates/policy.json`, `signing-key` and `bin/gitleaks`; never the repository),
  # or nowhere.
  - name: gates.delivery.Resolution
    kind: enum
    variants: [Flag, InstalledConfiguration, Default, Unresolved]
  # The installed hooks' protected configuration as `install` finds it. It is read only
  # when the repository (`--repository`) or the policy (`--policy`/`B10X_GATES_POLICY`)
  # is not named; with both named it is `NotConsulted`, whatever the key and scanner.
  # `Untrusted` covers a file that is not owner-only, a symlink, a directory others can
  # write, unparsable bytes and a repository that is not `<owner>/<repo>`.
  # `OtherRepository` is a trusted configuration naming another repository than
  # `--repository`.
  - name: gates.delivery.InstalledConfiguration
    kind: enum
    variants: [NotConsulted, Absent, Trusted, Untrusted, OtherRepository]
  # Where `ci` took the policy from: `B10X_GATES_POLICY_GZ`, `B10X_GATES_POLICY_JSON`,
  # or the protected policy file.
  - name: gates.delivery.PolicySource
    kind: enum
    variants: [Compressed, Json, File]

commands:
  - name: gates.delivery.Merge
    input:
      - {name: revision, type: String}
      - {name: revision_count, type: Integer}
      - {name: forbidden_options, type: 'List<String>'}
      - {name: resolved, type: Boolean}
      - {name: merge_drivers, type: 'List<String>'}
      - {name: in_progress, type: gates.delivery.Operation}
      - {name: integration, type: gates.delivery.Integration}
      - {name: merge_heads, type: Integer}
    outcomes:
      # Every option outside the admitted set, matched by its exact name (no
      # abbreviation): admitted are --no-ff, --quiet/-q, --verbose/-v, --stat,
      # --no-stat, --summary, --compact-summary, --signoff, --no-signoff,
      # --message/-m, --file/-F, --into-name, --cleanup, --no-edit,
      # --gpg-sign/-S, --no-gpg-sign, --verify-signatures, --no-verify-signatures,
      # --progress, --no-progress, --rerere-autoupdate, --no-rerere-autoupdate,
      # --overwrite-ignore and --no-overwrite-ignore. So -s/--strategy, -X,
      # --squash, --ff-only, --ff, --allow-unrelated-histories, --commit, -e/--edit,
      # --continue, --abort, --quit, --skip, --no-verify, -n, -c, --config-env,
      # --exec and every unlisted option are refused before a credential is minted.
      - name: forbidden-option
        when: forbidden_options.count > 0
        error: gates.delivery.ForbiddenOption
      # Exactly one revision: no octopus merge, no range.
      - name: not-one-revision
        when: revision_count != 1
        error: gates.delivery.NotOneRevision
      # The revision must name one commit (`git rev-parse --verify
      # <revision>^{commit}`); Git merges that commit's full hash, so `FETCH_HEAD`
      # with several for-merge lines merges only the first.
      - name: unresolved-revision
        when: resolved == false
        error: gates.delivery.UnresolvedRevision
      # A `merge.<driver>.driver` key in `.git/config` or `config.worktree` would run
      # a repository-chosen command during the merge.
      - name: merge-driver-configured
        when: merge_drivers.count > 0
        error: gates.delivery.MergeDriverConfigured
      - name: operation-in-progress
        when: in_progress != None
        error: gates.delivery.OperationInProgress
      # The conflict stays in the index; the error names the route to finish:
      # resolve, `git add`, `b10x-gates bot -- commit -F -`, or `git merge --abort`.
      - name: conflict
        when: integration == Conflicted
        error: gates.delivery.Conflicted
      # Read before the bot commits: `MERGE_HEAD` with more than one line would make
      # the commit an octopus merge. The merge stays in progress for `--abort`.
      - name: several-merge-heads
        when: merge_heads > 1
        error: gates.delivery.SeveralMergeHeads
      - name: up-to-date
        when: integration == UpToDate
        emits: [gates.delivery.NothingToMerge]
        payload:
          gates.delivery.NothingToMerge:
            revision: input.revision
      # One commit with two parents, bot author and committer, the given message or
      # Git's prepared one.
      - name: committed
        emits: [gates.delivery.BotCommitted]
        payload:
          gates.delivery.BotCommitted:
            revision: input.revision

  - name: gates.delivery.Revert
    input:
      - {name: revision, type: String}
      - {name: revision_count, type: Integer}
      - {name: forbidden_options, type: 'List<String>'}
      - {name: resolved, type: Boolean}
      - {name: merge_drivers, type: 'List<String>'}
      - {name: in_progress, type: gates.delivery.Operation}
      - {name: index_differs, type: Boolean}
      - {name: integration, type: gates.delivery.Reversion}
    outcomes:
      # Every option outside the admitted set, matched by its exact name: `git
      # revert` hands options it does not know to its revision walker, where
      # `--do-walk`, `--all`, `--tags` or `--stdin` would add commits. Admitted are
      # --mainline/-m <parent>, --cleanup, --no-edit, --signoff, --gpg-sign/-S,
      # --no-gpg-sign, --rerere-autoupdate, --no-rerere-autoupdate and --reference.
      - name: forbidden-option
        when: forbidden_options.count > 0
        error: gates.delivery.ForbiddenOption
      # Exactly one revision: no range such as `a..b`.
      - name: not-one-revision
        when: revision_count != 1
        error: gates.delivery.NotOneRevision
      # Git reverts the full hash of the one commit the revision names.
      - name: unresolved-revision
        when: resolved == false
        error: gates.delivery.UnresolvedRevision
      # A revert is a three-way merge: a configured merge driver would run as it
      # does for `merge`.
      - name: merge-driver-configured
        when: merge_drivers.count > 0
        error: gates.delivery.MergeDriverConfigured
      - name: operation-in-progress
        when: in_progress != None
        error: gates.delivery.OperationInProgress
      # `git revert --no-commit` reverts against the index as it stands, so a
      # staged change would ride inside the bot's `Revert "…"` commit.
      - name: staged-changes
        when: index_differs == true
        error: gates.delivery.StagedChanges
      # The conflict stays in the index; the error names `git revert --abort`.
      - name: conflict
        when: integration == Conflicted
        error: gates.delivery.Conflicted
      # One commit, bot author and committer, Git's prepared `Revert "…"` message.
      - name: committed
        emits: [gates.delivery.BotCommitted]
        payload:
          gates.delivery.BotCommitted:
            revision: input.revision

  # `b10x-gates bot --repository <owner>/<repo> -- delete-branch <branch>`, through
  # the REST API as the App, never through `git push`. The argument shape and the
  # name are refused before a credential is minted; the App then reads the default
  # branch, the branch, the comparison of its tip with the default branch, the
  # rulesets that apply to the branch and the branch again, and deletes only
  # `refs/heads/<branch>`.
  - name: gates.delivery.DeleteBranch
    input:
      - {name: name, type: String}
      - {name: argument_count, type: Integer}
      - {name: forbidden_options, type: 'List<String>'}
      - {name: name_problems, type: 'List<String>'}
      - {name: repository_resolved, type: Boolean}
      - {name: comparison_readable, type: Boolean}
      - {name: ancestry, type: gates.delivery.Ancestry}
      - {name: rules_readable, type: Boolean}
      - {name: unadmitted_rules, type: 'List<String>'}
      - {name: unattributed_rules, type: 'List<String>'}
      - {name: deletion_rules, type: Integer}
      - {name: repeated_rules, type: 'List<String>'}
      - {name: restricting_rulesets, type: 'List<Integer>'}
      - {name: current_tip, type: String}
    outcomes:
      # The remote is `--repository <owner>/<repo>` when given, else the `repository`
      # of the installed hooks' protected configuration
      # (`<git common dir>/b10x-gates-hooks/config.json`), either held to the
      # `<owner>/<repo>` shape. With neither, nothing is read and no credential is
      # minted; the refusal names both routes: `--repository <owner>/<repo>`, or
      # `b10x-gates install` in the repository. Only "not a git repository" counts as
      # no configuration: the common directory is located without the history guards
      # (a shallow or grafted repository still has its hooks installed), and any other
      # failure to locate it is refused with its cause.
      - name: no-repository
        when: repository_resolved == false
        error: gates.delivery.RepositoryRequired
      # No option at all (`--force`, `-f`, `--`): the verb takes exactly one branch.
      - name: options-given
        when: forbidden_options.count > 0
        error: gates.delivery.ForbiddenOption
      - name: not-one-branch
        when: argument_count != 1
        error: gates.delivery.NotOneBranch
      # Empty; `refs/` other than `refs/heads/` (a tag is never addressed); `..`, `:`,
      # `~`, `^`, `?`, `*`, `[`, `\`, `@{`, a space or a control character; an empty
      # or dot-led component; a `.lock`, `/` or `.` ending.
      - name: invalid-name
        when: name_problems.count > 0
        error: gates.delivery.InvalidBranchName
      - name: default-branch
        when_subject:
          predicate: default == true
        error: gates.delivery.DefaultBranch
      - name: protected-branch
        when_subject:
          predicate: protected == true
        error: gates.delivery.ProtectedBranch
      # The comparison is read through a path the API client's guard admits.
      - name: comparison-unreadable
        when: comparison_readable == false
        error: gates.delivery.ComparisonUnreadable
      # Deleting an unmerged tip would make its commits unreachable on the remote.
      - name: unmerged
        when: ancestry == Behind
        error: gates.delivery.Unmerged
      - name: diverged
        when: ancestry == Diverged
        error: gates.delivery.Unmerged
      # `GET /repos/<repo>/rules/branches/<branch>`: the rulesets that apply to the
      # branch, which classic protection (`protected`) does not cover and which the
      # App, as a bypass actor, would pass. An answer that is not a JSON array (or a 404) says
      # nothing, so it is refused.
      - name: rules-unreadable
        when: rules_readable == false
        error: gates.delivery.RulesUnreadable
      # Admitted rule types are those of the organization's bot-authority ruleset:
      # creation, update, deletion, non_fast_forward, commit_author_email_pattern,
      # committer_email_pattern, commit_message_pattern, committer_name_pattern and
      # branch_name_pattern. Any other type (required_status_checks,
      # pull_request, …), or a rule without a type, marks a branch someone protects.
      # Admitting a type is not admitting its ruleset: the outcomes below hold every
      # restricting rule to the one bot-authority ruleset.
      - name: ruled-branch
        when: unadmitted_rules.count > 0
        error: gates.delivery.RuledBranch
      # Every rule entry names the ruleset it comes from: a `ruleset_id` that is
      # missing or not a positive integer cannot be attributed, so it is refused.
      - name: unattributed-rule
        when: unattributed_rules.count > 0
        error: gates.delivery.UnattributedRule
      # The bot-authority ruleset carries one `deletion` rule; a second one is a
      # second ruleset restricting deletion.
      - name: deletion-restricted
        when: deletion_rules > 1
        error: gates.delivery.DeletionRestricted
      # The restricting types (creation, update, deletion, non_fast_forward) are the
      # bot-authority ruleset's, each carried once: one of them twice is a second
      # ruleset restricting the branch.
      - name: repeated-restriction
        when: repeated_rules.count > 0
        error: gates.delivery.RepeatedRestriction
      # Every restricting rule comes from one and the same ruleset, the bot's: a second
      # ruleset id among them is someone else protecting the branch, even with only
      # admitted types. The naming and message patterns may come from any ruleset.
      - name: several-restricting-rulesets
        when: restricting_rulesets.count > 1
        error: gates.delivery.SeveralRestrictingRulesets
      # The tip read again before the DELETE differs from the one compared.
      - name: moved-tip
        when_subject:
          predicate: tip != input.current_tip
        error: gates.delivery.TipMoved
      - name: deleted
        moves: gates.delivery.RemoteBranch.delete
        instance: name
        emits: [gates.delivery.BranchDeleted]
        payload:
          gates.delivery.BranchDeleted:
            name: input.name
            tip: input.current_tip
      - name: unknown-branch
        unknown_instance: true
        error: gates.delivery.UnknownBranch
        payload:
          gates.delivery.UnknownBranch: {name: input.name}

  # `b10x-gates install`, which every gates release asks each repository to rerun.
  # A reinstall needs no flag: without `--repository` the repository is the installed
  # hooks' configuration's (`<git common dir>/b10x-gates-hooks/config.json`, read
  # through the same protected read as the hooks), and without `--policy` and
  # `B10X_GATES_POLICY` the policy is the path that configuration names; likewise the
  # signing key without `--key` and `B10X_GATES_KEY`, and the scanner without
  # `--gitleaks` and `B10X_GATES_GITLEAKS`. A flag or its environment variable always
  # wins. A first install, with no configuration, keeps the defaults under the
  # configuration home for the policy, the key and the scanner.
  # The configuration is read only when the repository or the policy is not named.
  # With both named it is not read at all, so a left-behind, unparsable or
  # not-owner-only configuration never blocks an explicit repair install, and the key
  # and scanner come from their flag, their environment variable or the defaults under
  # the configuration home. Its values are used only when the repository it names is
  # the resolved repository.
  - name: gates.delivery.InstallHooks
    input:
      - {name: repository, type: String}
      - {name: configured_repository, type: String}
      - {name: configuration, type: gates.delivery.InstalledConfiguration}
      - {name: repository_source, type: gates.delivery.Resolution}
      - {name: policy_source, type: gates.delivery.Resolution}
      - {name: key_source, type: gates.delivery.Resolution}
      - {name: scanner_source, type: gates.delivery.Resolution}
      - {name: policy_loaded, type: Boolean}
      - {name: repository_enrolled, type: Boolean}
    outcomes:
      # A configuration that is present but untrusted, unparsable or names a
      # repository that is not `<owner>/<repo>` is refused with its cause, never
      # skipped as if absent. The refusal names the remedy that installs past it:
      # `pass --repository <owner>/<repo> and --policy <path>`.
      - name: untrusted-configuration
        when: configuration == Untrusted
        error: gates.delivery.UntrustedConfiguration
      # `--repository` names another repository than the configuration read because
      # the policy is not named: refused naming both repositories and the remedy,
      # `--policy <path>` or a reinstall; nothing of the configuration is used.
      - name: configuration-names-another-repository
        when: configuration == OtherRepository
        error: gates.delivery.ConfiguredRepositoryMismatch
        payload:
          gates.delivery.ConfiguredRepositoryMismatch:
            repository: input.repository
            configured_repository: input.configured_repository
      # No `--repository` and no installed configuration: the refusal names both
      # routes, `--repository <owner>/<repo>` and an installed configuration.
      - name: no-repository
        when: repository_source == Unresolved
        error: gates.delivery.RepositoryRequired
      # No `--policy`, no `B10X_GATES_POLICY`, no installed configuration and no
      # default policy: the refusal names `--policy`/`B10X_GATES_POLICY` and an
      # installed configuration.
      - name: no-policy
        when: policy_source == Unresolved
        error: gates.delivery.PolicyRequired
      # The resolved policy path is not a trusted policy; refused naming the path.
      - name: policy-unavailable
        when: policy_loaded == false
        error: gates.delivery.PolicyUnavailable
      # The loaded policy must still enrol the repository, as for every command.
      - name: not-enrolled
        when: repository_enrolled == false
        error: gates.delivery.RepositoryNotEnrolled
        payload:
          gates.delivery.RepositoryNotEnrolled: {repository: input.repository}
      # The new configuration names the resolved repository and the canonical policy,
      # key and scanner paths, and keeps the hooks it already chained.
      - name: installed
        emits: [gates.delivery.HooksInstalled]
        payload:
          gates.delivery.HooksInstalled:
            repository: input.repository

  # `b10x-gates scan-artifact <file>`, run on every release executable before it is
  # published. The file is parsed, never executed. `static` is true when the ELF has
  # no `PT_INTERP` program header; `name_service_switch` is true when its bytes hold
  # glibc's NSS loader (`nsswitch.conf`). A statically linked glibc resolves names by
  # loading `libnss_*.so` at run time; on a host whose `hosts:` line names a module
  # such as `resolve`, the second lookup crashes the process (SIGSEGV), so every verb
  # that makes two GitHub requests dies silently. The release target is
  # `x86_64-unknown-linux-musl`, whose resolver loads nothing.
  - name: gates.delivery.ValidateArtifact
    input:
      - {name: format_supported, type: Boolean}
      - {name: static, type: Boolean}
      - {name: name_service_switch, type: Boolean}
      - {name: private_rules, type: Integer}
      - {name: secrets, type: Integer}
    outcomes:
      # Anything but a bounded, well-formed ELF64 little-endian ET_EXEC or ET_DYN.
      - name: format-unsupported
        when: format_supported == false
        error: gates.delivery.ArtifactFormatUnsupported
      # Refused before any scanner runs; the error names the musl target.
      - name: static-name-service
        when: {all: [static == true, name_service_switch == true]}
        error: gates.delivery.StaticNameService
      - name: private-rule
        when: private_rules > 0
        error: gates.delivery.ArtifactPrivateRule
      - name: secret
        when: secrets > 0
        error: gates.delivery.ArtifactSecret
      - name: validated
        emits: [gates.delivery.ArtifactValidated]
        payload:
          gates.delivery.ArtifactValidated:
            static: input.static

  # `b10x-gates ci`, the reusable workflow's check, reads the private policy from its
  # environment before it reads anything else. A secret is capped at 48 KB, so the
  # workflow passes `B10X_GATES_POLICY_GZ` (the policy compressed with gzip and encoded
  # as standard base64); `B10X_GATES_POLICY_JSON` (the plain JSON a caller on an older
  # pin passes) and the protected policy file are the fallbacks, in that order. A
  # variable counts as given only when it is set and non-empty. A compressed value that
  # does not decode, decompress within 4 MiB or parse is refused naming
  # `B10X_GATES_POLICY_GZ`; it never falls back to another source.
  - name: gates.delivery.LoadCiPolicy
    input:
      - {name: source, type: gates.delivery.PolicySource}
      - {name: decoded, type: Boolean}
      - {name: parsed, type: Boolean}
    outcomes:
      - name: compressed-undecodable
        when: {all: [source == Compressed, decoded == false]}
        error: gates.delivery.CompressedPolicyInvalid
      - name: unparsable
        when: parsed == false
        error: gates.delivery.PolicyUnavailable
      - name: loaded
        emits: [gates.delivery.CiPolicyLoaded]
        payload:
          gates.delivery.CiPolicyLoaded:
            source: input.source

  # `b10x-gates policy publish`: the one step that puts the trusted policy into the CI
  # secrets `ci` reads. It publishes only `origin/main:policy.json` of the policy
  # repository, after a fetch and read with `git show`, never a working-tree file, so an
  # uncommitted edit cannot reach CI. The targets come from a targets file, not code:
  # the organization secret `B10X_GATES_POLICY_GZ` (the whole policy, gzip -9 then
  # base64) and, while callers on older pins exist, the sliced `B10X_GATES_POLICY`
  # secrets (the organization's without the listed repositories' exceptions, each listed
  # repository's with only its own). `unchanged` is true when the policy commit is the
  # one the marker in Gates' state directory names. A dry run (the default) prints the
  # commit, targets and sizes; `--apply` writes each secret with `gh secret set`, the
  # value on standard input, reads the names back with `gh secret list`, and only then
  # moves the marker.
  - name: gates.delivery.PublishPolicy
    input:
      - {name: unchanged, type: Boolean}
      - {name: force, type: Boolean}
      - {name: policy_valid, type: Boolean}
      # Values of 48,000 bytes or more; any one publishes nothing.
      - {name: oversized, type: Integer}
      - {name: apply, type: Boolean}
      - {name: written, type: Boolean}
      - {name: read_back, type: Boolean}
    outcomes:
      - name: unchanged
        when: {all: [unchanged == true, force == false]}
        emits: [gates.delivery.PolicyUnchanged]
        payload:
          gates.delivery.PolicyUnchanged: {unchanged: input.unchanged}
      - name: policy-invalid
        when: policy_valid == false
        error: gates.delivery.PublishedPolicyInvalid
      - name: oversized
        when: oversized > 0
        error: gates.delivery.SecretTooLarge
        payload:
          gates.delivery.SecretTooLarge: {oversized: input.oversized}
      - name: planned
        when: apply == false
        emits: [gates.delivery.PolicyPublishPlanned]
        payload:
          gates.delivery.PolicyPublishPlanned: {apply: input.apply}
      - name: write-failed
        when: written == false
        error: gates.delivery.SecretWriteFailed
      - name: not-read-back
        when: read_back == false
        error: gates.delivery.SecretNotReadBack
      - name: published
        emits: [gates.delivery.PolicyPublished]
        payload:
          gates.delivery.PolicyPublished: {apply: input.apply}

events:
  - name: gates.delivery.PolicyUnchanged
    fields: [{name: unchanged, type: Boolean}]
  - name: gates.delivery.PolicyPublishPlanned
    fields: [{name: apply, type: Boolean}]
  - name: gates.delivery.PolicyPublished
    fields: [{name: apply, type: Boolean}]
  - name: gates.delivery.CiPolicyLoaded
    fields: [{name: source, type: gates.delivery.PolicySource}]
  - name: gates.delivery.ArtifactValidated
    fields: [{name: static, type: Boolean}]
  - name: gates.delivery.BranchDeleted
    fields: [{name: name, type: String}, {name: tip, type: String}]
  - name: gates.delivery.BotCommitted
    fields: [{name: revision, type: String}]
  - name: gates.delivery.NothingToMerge
    fields: [{name: revision, type: String}]
  - name: gates.delivery.HooksInstalled
    fields: [{name: repository, type: String}]

errors:
  - name: gates.delivery.ForbiddenOption
    fields: [{name: forbidden_options, type: 'List<String>'}]
  - name: gates.delivery.NotOneRevision
    fields: [{name: revision_count, type: Integer}]
  - name: gates.delivery.MergeDriverConfigured
    fields: [{name: merge_drivers, type: 'List<String>'}]
  - name: gates.delivery.OperationInProgress
    fields: [{name: in_progress, type: gates.delivery.Operation}]
  - name: gates.delivery.UnresolvedRevision
    fields: [{name: revision, type: String}]
  - name: gates.delivery.SeveralMergeHeads
    fields: [{name: merge_heads, type: Integer}]
  - name: gates.delivery.StagedChanges
    fields: [{name: index_differs, type: Boolean}]
  - name: gates.delivery.ComparisonUnreadable
    fields: [{name: name, type: String}]
