[package]
name = "b10x-gates"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Common security checks, signed Git evidence, and bot delivery"
repository = "https://github.com/beyond10x/gates"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
regex = "1"
# Standard signature implementation; no custom cryptography.
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Verified HTTPS and standard GitHub App JWT signing at the delivery boundary.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
jsonwebtoken = "9"
tempfile = "3"
libc = "0.2"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"
